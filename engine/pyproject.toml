[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neurostream-engine"
version = "0.1.0"
description = "Neural signal decoding engine for the NeuroStream dashboard"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy>=1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
